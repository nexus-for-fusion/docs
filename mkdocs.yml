site_name: Nexus for Oracle Fusion Cloud
site_description: Configuration and master data migration for Oracle Fusion Cloud, with review, approval and proof.
site_url: https://nexus-for-fusion.github.io/docs/
repo_url: https://github.com/nexus-for-fusion/docs
edit_uri: ""
copyright: >
  © Nexus authors · CC BY-NC-ND 4.0 ·
  Nexus is an independent product and is not affiliated with, endorsed by, or sponsored by Oracle.
  Oracle and Oracle Fusion Cloud are trademarks of Oracle Corporation and its affiliates.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

nav:
  - Overview: index.md
  - Feature tour: features.md
  - Walkthrough: walkthrough-suppliers.md
  - Proven at scale: scale.md
  - Getting started: getting-started.md
  - FAQ: faq.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - attr_list

plugins:
  - search
